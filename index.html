<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NX_ | TSB</title>
<link rel="icon" href="data:,">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap');

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
}

:root {
  --bg-abyss: #000000;
  --bg-void: #000000;
  --bg-card: #000000;
  --bg-card-hover: #000000;
  --bg-code: #000000;
  --w: #ffffff;
  --d90: rgba(255, 255, 255, 0.90);
  --d75: rgba(255, 255, 255, 0.75);
  --d50: rgba(255, 255, 255, 0.50);
  --d30: rgba(255, 255, 255, 0.30);
  --d15: rgba(255, 255, 255, 0.15);
  --d08: rgba(255, 255, 255, 0.08);

  --border-void: rgba(255, 255, 255, 0.12);
  --border-glow: rgba(255, 255, 255, 0.35);
  --border-acc: rgba(255, 255, 255, 0.18);

  --mono: 'JetBrains Mono', 'Consolas', monospace;
  --ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --ck: #ffffff;
  --cs: rgba(255, 255, 255, 0.85);
  --cu: #ffffff;
  --cf: #ffffff;
  --cn: rgba(255, 255, 255, 0.85);
  --cp: rgba(255, 255, 255, 0.55);
  --cc: rgba(255, 255, 255, 0.32);

  --s-online: #00ff88;
  --s-idle: #ffbe0b;
  --s-dnd: #ff3366;
  --s-offline: #52525b;
}

html, body {
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  background: #000000;
  color: var(--w);
  font-family: var(--ui);
  overflow-x: hidden;
  overflow-y: auto;
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
}
body.gate-locked {
  overflow: hidden !important;
}

/* CLICK GATE */
#click-gate {
  position: fixed;
  inset: 0;
  z-index: 100000;
  background: #000000;
  cursor: pointer;
  transition: opacity 0.5s ease;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}
#click-gate.gate-pass {
  opacity: 0;
  pointer-events: none;
}
.gate-core {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12);
  animation: gate-breathe 3s ease-in-out infinite;
  pointer-events: none;
  transition: width 0.3s, height 0.3s, border-color 0.3s, box-shadow 0.3s;
}
.gate-core-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  animation: gate-dot-pulse 2s ease-in-out infinite;
  pointer-events: none;
  transition: width 0.3s, height 0.3s, background 0.3s;
}
@keyframes gate-breathe {
  0%, 100% { transform: translate(-50%, -50%) scale(1); border-color: rgba(255,255,255,0.08); }
  50% { transform: translate(-50%, -50%) scale(1.15); border-color: rgba(255,255,255,0.2); }
}
@keyframes gate-dot-pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}
.gate-shockwave {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  transform: translate(-50%, -50%) scale(0);
  animation: gate-shock 0.7s ease-out forwards;
  pointer-events: none;
}
@keyframes gate-shock {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}
.gate-spark {
  position: absolute;
  width: 1px;
  height: 1px;
  border-radius: 50%;
  background: #ffffff;
  pointer-events: none;
  animation: gate-spark-fly 0.6s ease-out forwards;
}
@keyframes gate-spark-fly {
  0% { opacity: 1; transform: translate(0, 0); }
  100% { opacity: 0; }
}
.gate-ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  transform: translate(-50%, -50%);
  animation: ripple-expand 0.6s ease-out forwards;
  pointer-events: none;
}
@keyframes ripple-expand {
  0% { width: 0; height: 0; opacity: 1; }
  100% { width: 240px; height: 240px; opacity: 0; }
}
.gate-dot {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #ffffff;
  transform: translate(-50%, -50%);
  animation: dot-fade 0.8s ease-out forwards;
  pointer-events: none;
}
@keyframes dot-fade {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
}

/* PAGE-WIDE CLICK EFFECT (after gate) */
.page-ripple {
  position: fixed;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  transform: translate(-50%, -50%);
  animation: page-ripple-expand 0.5s ease-out forwards;
  pointer-events: none;
  z-index: 99999;
}
@keyframes page-ripple-expand {
  0% { width: 0; height: 0; opacity: 1; }
  100% { width: 120px; height: 120px; opacity: 0; }
}

#void-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
  opacity: 0.95;
}

::-webkit-scrollbar { width: 0; height: 0; display: none; }
html { scrollbar-width: none; -ms-overflow-style: none; }

#live-clock {
  text-align: center;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: #ffffff;
  letter-spacing: 0.15em;
  padding: 0 0 8px 0;
  opacity: 0.75;
}

#app {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  padding: 40px 24px 120px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* MINIMAL TITLE HEADER */
#title {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#title h1 {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--w);
  text-transform: uppercase;
}
#title hr {
  border: none;
  border-bottom: 1px solid var(--border-void);
  width: 100%;
}

/* CODE LOADER BOX */
#loader-section {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#ed {
  background: #000000;
  border: 1px solid var(--border-void);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,1);
}
#ed-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 18px;
  background: #000000;
  border-bottom: 1px solid var(--border-void);
}
.ed-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--d75);
}
.ed-circle {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px rgba(255,255,255,0.8);
}
#copy-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #000000;
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #ffffff;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 6px 14px;
  cursor: pointer;
  border-radius: 2px;
  position: relative;
  transition: all 0.15s ease;
}
#copy-btn:hover {
  background: #000000;
  color: #ffffff;
  border-color: #ffffff;
}
#copy-btn svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#copy-toast {
  position: absolute;
  top: auto;
  bottom: -32px;
  right: 0;
  background: #000000;
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #ffffff;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--mono);
  padding: 4px 10px;
  border-radius: 2px;
  opacity: 0;
  transform: translateY(-4px);
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 12px rgba(0,0,0,1);
  z-index: 10;
}
#copy-toast.show {
  opacity: 1;
  transform: translateY(0);
}

#code-area {
  padding: 18px 22px;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.65;
  white-space: pre;
  overflow-x: auto;
  color: var(--w);
  background: #000000;
}
.sk { color: var(--ck); font-weight: 700; }
.sf { color: var(--cf); font-weight: 600; text-decoration: underline; text-decoration-color: rgba(255,255,255,0.25); }
.ss { color: var(--cs); }
.su { color: var(--cu); }
.sn { color: var(--cn); }
.sp { color: var(--cp); }
.sc { color: var(--cc); font-style: italic; }

/* DISCORD PROFILE BAR */
#dc {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #000000;
  border: 1px solid var(--border-void);
  border-radius: 4px;
  padding: 12px 18px;
}
#dc-av {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border-void);
  overflow: visible;
  flex-shrink: 0;
}
#dc-av-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}
#status-dot {
  position: absolute;
  bottom: -1px;
  right: -1px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 2px solid #000;
}
#status-dot.online { background: var(--s-online); box-shadow: 0 0 6px var(--s-online); }
#status-dot.idle { background: var(--s-idle); box-shadow: 0 0 6px var(--s-idle); }
#status-dot.dnd { background: var(--s-dnd); box-shadow: 0 0 6px var(--s-dnd); }
#status-dot.offline { background: var(--s-offline); }

#dc-label {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--w);
  letter-spacing: 0.05em;
}
#dc-label .sep {
  color: var(--d30);
  margin: 0 6px;
}
#dc-spacer { flex: 1; }
#show-profile-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 1px solid var(--border-void);
  color: var(--d75);
  font-family: var(--mono);
  font-size: 11px;
  padding: 6px 14px;
  text-decoration: none;
  border-radius: 2px;
  transition: all 0.15s ease;
}
#show-profile-btn:hover {
  border-color: #fff;
  color: #fff;
}
#show-profile-btn svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* TERMINAL ACCESS BANNER (PANEL DOKUMENTACJI) */
.terminal-toggle-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 20px;
  background: #000000;
  border: 1px solid var(--border-void);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}
.terminal-toggle-strip:hover {
  border-color: rgba(255, 255, 255, 0.4);
  background: #000000;
}
.toggle-strip-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.terminal-cursor {
  font-family: var(--mono);
  font-weight: 700;
  color: #ffffff;
}
.toggle-title {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.toggle-chevron {
  width: 18px;
  height: 18px;
  stroke: #fff;
  stroke-width: 2;
  fill: none;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.terminal-toggle-strip.is-open .toggle-chevron {
  transform: rotate(180deg);
}

/* COLLAPSIBLE DOCS CONTAINER */
#docs-content {
  display: none;
  flex-direction: column;
  gap: 36px;
  margin-top: 6px;
}
#docs-content.is-open {
  display: flex;
}

/* FILTER PILLS (CLEAN, NO TEXTBOX) */
.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  padding: 14px 18px;
  background: #000000;
  border: 1px solid var(--border-void);
  border-radius: 4px;
}
.filter-pills {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.pill-btn {
  background: #000000;
  border: 1px solid var(--border-void);
  color: var(--d50);
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.04em;
}
.pill-btn:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.35);
}
.pill-btn.active {
  background: #ffffff;
  color: #000000;
  border-color: #ffffff;
  font-weight: 700;
}

/* SECTION STRUCTURE */
.doc-section {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.section-headline {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  border-bottom: 1px solid var(--border-void);
  padding-bottom: 12px;
}
.section-title {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.section-num {
  color: #ffffff;
  font-weight: 700;
}
.section-badge {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--d50);
  border: 1px solid var(--border-void);
  padding: 3px 8px;
  border-radius: 2px;
  background: #000000;
}

/* CARDS GRID */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 16px;
}
.doc-card {
  background: #000000;
  border: 1px solid var(--border-void);
  border-radius: 4px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.2s ease;
}
.doc-card:hover {
  background: #000000;
  border-color: var(--border-glow);
}
.doc-card.full-width {
  grid-column: 1 / -1;
}
.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card-tag {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--d50);
}
.code-inline {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--d75);
  background: rgba(255, 255, 255, 0.06);
  padding: 2px 6px;
  border-radius: 2px;
}
.card-title {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.01em;
}
.card-desc {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--d75);
}
.doc-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 4px;
}
.doc-list li {
  font-size: 12px;
  line-height: 1.5;
  color: var(--d75);
  position: relative;
  padding-left: 14px;
}
.doc-list li::before {
  content: '>';
  position: absolute;
  left: 0;
  color: var(--d30);
  font-family: var(--mono);
}
.doc-list strong {
  color: #fff;
  font-family: var(--mono);
  font-weight: 600;
}
.doc-list code {
  font-family: var(--mono);
  font-size: 11px;
  background: rgba(255, 255, 255, 0.08);
  padding: 2px 5px;
  border-radius: 2px;
  color: #fff;
}

/* BADGES & KEYBIND STYLING */
.kb-key {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #fff;
  padding: 2px 6px;
  border-radius: 2px;
}
.badges-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.badge-tag {
  font-family: var(--mono);
  font-size: 10.5px;
  background: #000000;
  border: 1px solid var(--border-void);
  padding: 4px 8px;
  border-radius: 2px;
  color: var(--d75);
}
.badge-tag.highlight {
  border-color: rgba(255, 255, 255, 0.4);
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
}
.badge-tag.cyan {
  border-color: rgba(255, 255, 255, 0.35);
  color: #ffffff;
  background: #000000;
}
.badge-tag.gold {
  border-color: rgba(255, 255, 255, 0.3);
  color: rgba(255, 255, 255, 0.85);
  background: #000000;
}
.badge-tag.red {
  border-color: rgba(255, 255, 255, 0.25);
  color: rgba(255, 255, 255, 0.75);
  background: #000000;
}

/* KEYBINDS TABLE */
.table-container {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border-void);
  border-radius: 4px;
  background: #000000;
}
.keybind-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  text-align: left;
}
.keybind-table th {
  background: #000000;
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--d75);
  border-bottom: 1px solid var(--border-void);
}
.keybind-table td {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  vertical-align: top;
  line-height: 1.5;
  color: var(--d75);
}
.keybind-table tr:hover td {
  background: rgba(255, 255, 255, 0.03);
}
.keybind-table code {
  font-family: var(--mono);
  font-size: 11px;
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
  padding: 2px 6px;
  border-radius: 2px;
}

@media (max-width: 820px) {
  .cards-grid { grid-template-columns: 1fr; }
  #app { padding: 20px 14px 100px; gap: 20px; }
}

</style>
</head>
<body>

<div id="click-gate"></div>

<template id="app-template">
<canvas id="void-canvas"></canvas>

<div id="app">

  <div id="live-clock"></div>

  <div id="title">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
      <h1>The Strongest Battlegrounds . . .</h1>
      <span class="section-badge" data-i18n="doc_ai_badge">DOCUMENTATION MADE BY AI</span>
    </div>
    <hr>
  </div>

  <section id="loader-section">
    <div id="ed">
      <div id="ed-top">
        <div class="ed-meta">
          <div class="ed-circle"></div>
          <span data-i18n="loader_title">LOADSTRING LOADER NX</span>
        </div>
        <div id="copy-btn">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span data-i18n="copy_btn">Copy</span>
          <div id="copy-toast" data-i18n="copied">Copied</div>
        </div>
      </div>
      <div id="code-area"></div>
    </div>

    <div id="dc">
      <div id="dc-av">
        <img id="dc-av-img" alt="avatar">
        <div id="status-dot" class="offline"></div>
      </div>
      <div id="dc-label">
        NOTHING X <span class="sep">|</span> nothingff
      </div>
      <div id="dc-spacer"></div>
      <a id="show-profile-btn" href="https://discord.com/users/1161363602146607154" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span data-i18n="discord_profile">Show Profile</span>
      </a>
    </div>

    <div id="toggle-docs-btn" class="terminal-toggle-strip">
      <div class="toggle-strip-left">
        <span class="terminal-cursor">&gt;_</span>

<script>

document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('selectstart', function(e){ e.preventDefault(); });
document.addEventListener('copy', function(e){ e.preventDefault(); });
document.addEventListener('cut', function(e){ e.preventDefault(); });
document.addEventListener('dragstart', function(e){ e.preventDefault(); });

(function(){
  document.addEventListener('mousedown', function(e){
    if(e.button !== 0) return;
    if(document.getElementById('click-gate') && document.getElementById('click-gate').style.display !== 'none') return;

    var ripple = document.createElement('div');
    ripple.className = 'page-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(function(){ ripple.remove(); }, 550);
  });
})();

(function(){
  var gate = document.getElementById('click-gate');
  if(!gate) return;

  document.body.classList.add('gate-locked');

  var core = document.createElement('div');
  core.className = 'gate-core';
  gate.appendChild(core);
  var coreInner = document.createElement('div');
  coreInner.className = 'gate-core-inner';
  core.appendChild(coreInner);

  var clicks = [];
  var REQUIRED = 3;
  var MIN_CPS = 3.7;
  var passed = false;
  var tamperCount = 0;
  var MAX_TAMPER = 3;
  var destroyed = false;
  var totalClicks = 0;

  function createGateElement(){
    var g = document.createElement('div');
    g.id = 'click-gate';
    g.style.cssText = 'position:fixed;inset:0;z-index:100000;background:#000000;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden;';
    var c = document.createElement('div');
    c.className = 'gate-core';
    var ci = document.createElement('div');
    ci.className = 'gate-core-inner';
    c.appendChild(ci);
    g.appendChild(c);
    return g;
  }

  function nukeEverything(){
    destroyed = true;
    try { document.title = 'NX'; } catch(e){}
    document.body.innerHTML = '';
    document.body.style.cssText = 'margin:0;padding:0;background:#000000;overflow:hidden;';
    document.documentElement.style.cssText = 'background:#000000;overflow:hidden;';
    alert('NX');
    document.body.innerHTML = '';
    document.body.style.background = '#000000';
  }

  function attachGateListeners(gateEl){
    gateEl.addEventListener('mousedown', function(e){
      if(e.button !== 0) return;
      if(passed || destroyed) return;

      var ripple = document.createElement('div');
      ripple.className = 'gate-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      gateEl.appendChild(ripple);
      setTimeout(function(){ ripple.remove(); }, 650);

      for(var i = 0; i < 6; i++){
        var dot = document.createElement('div');
        dot.className = 'gate-dot';
        var angle = Math.random() * Math.PI * 2;
        var dist = 20 + Math.random() * 50;
        dot.style.left = (e.clientX + Math.cos(angle) * dist) + 'px';
        dot.style.top = (e.clientY + Math.sin(angle) * dist) + 'px';
        gateEl.appendChild(dot);
        setTimeout(function(){ dot.remove(); }, 850);
      }

      var coreEl = gateEl.querySelector('.gate-core');
      if(coreEl){
        totalClicks++;
        var grow = Math.min(totalClicks / 8, 1);

        var shock = document.createElement('div');
        shock.className = 'gate-shockwave';
        var shockSize = 80 + grow * 200;
        shock.style.width = shockSize + 'px';
        shock.style.height = shockSize + 'px';
        shock.style.top = '50%';
        shock.style.left = '50%';
        coreEl.parentElement.appendChild(shock);
        setTimeout(function(){ shock.remove(); }, 750);

        var coreSize = 60 + grow * 80;
        coreEl.style.width = coreSize + 'px';
        coreEl.style.height = coreSize + 'px';
        var alpha = 0.12 + grow * 0.55;
        coreEl.style.borderColor = 'rgba(255,255,255,' + alpha + ')';
        coreEl.style.boxShadow = '0 0 ' + (grow * 30) + 'px rgba(255,255,255,' + (grow * 0.2) + ')';

        var innerEl = coreEl.querySelector('.gate-core-inner');
        if(innerEl){
          var innerSize = 4 + grow * 10;
          innerEl.style.width = innerSize + 'px';
          innerEl.style.height = innerSize + 'px';
          innerEl.style.background = 'rgba(255,255,255,' + (0.25 + grow * 0.65) + ')';
        }

        for(var s = 0; s < 3 + Math.floor(grow * 4); s++){
          var spark = document.createElement('div');
          spark.className = 'gate-spark';
          var sAngle = Math.random() * Math.PI * 2;
          var sDist = 30 + Math.random() * (coreSize * 0.9);
          var sx = (window.innerWidth / 2) + Math.cos(sAngle) * sDist;
          var sy = (window.innerHeight / 2) + Math.sin(sAngle) * sDist;
          spark.style.left = sx + 'px';
          spark.style.top = sy + 'px';
          gateEl.appendChild(spark);
          setTimeout(function(){ spark.remove(); }, 650);
        }
      }

      var now = Date.now();
      clicks.push(now);
      if(clicks.length > REQUIRED) clicks.shift();

      if(clicks.length >= REQUIRED){
        var elapsed = (clicks[clicks.length - 1] - clicks[0]) / 1000;
        var cps = (REQUIRED - 1) / elapsed;
        if(cps >= MIN_CPS){
          passed = true;
          gateEl.classList.add('gate-pass');
          document.body.classList.remove('gate-locked');
          observer.disconnect();
          clearInterval(checkInterval);
          setTimeout(function(){
            gateEl.remove();
          }, 550);

          var tpl = document.getElementById('app-template');
          if(tpl){
            document.body.appendChild(tpl.content.cloneNode(true));
            tpl.remove();
          }
          initVoidCanvas();
          initApp();
        }
      }
    });
    gateEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

  attachGateListeners(gate);

  var observer = new MutationObserver(function(mutations){
    if(passed || destroyed) return;
    var gateExists = document.getElementById('click-gate');
    if(!gateExists){
      tamperCount++;
      if(tamperCount >= MAX_TAMPER){
        observer.disconnect();
        nukeEverything();
        return;
      }
      var newGate = createGateElement();
      document.body.insertBefore(newGate, document.body.firstChild);
      attachGateListeners(newGate);
      document.body.classList.add('gate-locked');
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });

  var checkInterval = setInterval(function(){
    if(passed){ clearInterval(checkInterval); return; }
    if(destroyed){ clearInterval(checkInterval); return; }
    var gateEl = document.getElementById('click-gate');
    var tampered = false;
    if(!gateEl){
      tampered = true;
    } else {
      var cs = window.getComputedStyle(gateEl);
      if(cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.5) tampered = true;
      if(parseInt(cs.zIndex) < 99999) tampered = true;
      if(cs.position !== 'fixed') tampered = true;
      var rect = gateEl.getBoundingClientRect();
      if(rect.width < 100 || rect.height < 100) tampered = true;
      if(rect.left > window.innerWidth || rect.top > window.innerHeight) tampered = true;
      if(rect.right < 0 || rect.bottom < 0) tampered = true;
      if(cs.pointerEvents === 'none') tampered = true;
      if(cs.clip && cs.clip !== 'auto' && cs.clip !== 'none') tampered = true;
      if(cs.clipPath && cs.clipPath !== 'none') tampered = true;
      if(parseFloat(cs.maxHeight) === 0 || parseFloat(cs.maxWidth) === 0) tampered = true;
    }
    if(tampered && !passed){
      tamperCount++;
      if(tamperCount >= MAX_TAMPER){
        clearInterval(checkInterval);
        observer.disconnect();
        nukeEverything();
        return;
      }
      if(gateEl) gateEl.remove();
      var newGate = createGateElement();
      document.body.insertBefore(newGate, document.body.firstChild);
      attachGateListeners(newGate);
      document.body.classList.add('gate-locked');
    }
  }, 400);
})();

function initVoidCanvas() {
  const canvas = document.getElementById('void-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h, cx, cy;
  let particles = [];
  const PARTICLE_COUNT = 300;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cx = w * 0.5;
    cy = h * 0.5;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor() {
      this.reset(true);
    }
    reset(initial) {
      const angle = Math.random() * Math.PI * 2;
      const dist = initial ? Math.random() * Math.max(w, h) * 0.8 + 80 : Math.max(w, h) * 0.75 + Math.random() * 200;
      this.x = cx + Math.cos(angle) * dist;
      this.y = cy + Math.sin(angle) * dist;
      this.r = Math.random() * 1.5 + 0.6;
      this.speed = Math.random() * 0.4 + 0.2;
      this.alpha = Math.random() * 0.6 + 0.2;
      this.hue = 0;
    }
    update() {
      const dx = cx - this.x;
      const dy = cy - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 48) {
        this.reset(false);
        return;
      }

      const force = 180 / (dist + 30);
      const angle = Math.atan2(dy, dx);
      const tangent = angle + Math.PI * 0.52;

      this.x += Math.cos(angle) * force * 1.2 + Math.cos(tangent) * this.speed * 2.2;
      this.y += Math.sin(angle) * force * 1.2 + Math.sin(tangent) * this.speed * 2.2;
      this.alpha = Math.min(0.9, (dist - 40) / 300);
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
  }

  let mouseX = cx, mouseY = cy;
  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  function render() {
    ctx.clearRect(0, 0, w, h);

    cx += (w * 0.5 + (mouseX - w * 0.5) * 0.05 - cx) * 0.03;
    cy += (h * 0.5 + (mouseY - h * 0.5) * 0.05 - cy) * 0.03;

    ctx.beginPath();
    ctx.arc(cx, cy, 46, 0, Math.PI * 2);
    ctx.fillStyle = '#000000';
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
    ctx.lineWidth = 1;
    ctx.stroke();

    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
    }

    requestAnimationFrame(render);
  }
  render();
}

const CODE = `-- NOTHING X
loadstring(game:HttpGet("https://raw.githubusercontent.com/nothingff0/0/0/0"))();
-- NOTHING_X`;

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const KW = new Set(['and','break','do','else','elseif','end','false','for','function','if','in','local','nil','not','or','repeat','return','then','true','until','while']);
const BT = new Set(['print','warn','error','require','pairs','ipairs','type','tostring','tonumber','pcall','wait','spawn','game','workspace','loadstring','HttpGet']);

function tokLine(line){
  let o='', i=0, n=line.length;
  while(i<n){
    if(line[i]==='-' && line[i+1]==='-'){
      o += `<span class="sc">${esc(line.slice(i))}</span>`;
      i=n; continue;
    }
    if(line[i]==='"' || line[i]==="'"){
      const q=line[i]; let j=i+1;
      while(j<n && line[j]!==q){ if(line[j]==='\\') j++; j++; }
      const str=line.slice(i, j+1);
      o += str.includes('http') ? `<span class="su">${esc(str)}</span>` : `<span class="ss">${esc(str)}</span>`;
      i=j+1; continue;
    }
    if(/[0-9]/.test(line[i])){
      let j=i; while(j<n && /[0-9._xXa-fA-F]/.test(line[j])) j++;
      o += `<span class="sn">${esc(line.slice(i,j))}</span>`;
      i=j; continue;
    }
    if(/[A-Za-z_]/.test(line[i])){
      let j=i; while(j<n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const w=line.slice(i,j);
      if(KW.has(w)) o += `<span class="sk">${esc(w)}</span>`;
      else if(BT.has(w)) o += `<span class="sf">${esc(w)}</span>`;
      else o += esc(w);
      i=j; continue;
    }
    if(/[{}()\[\].,;:+\-*\/%^#<>=~]/.test(line[i])){
      o += `<span class="sp">${esc(line[i])}</span>`;
      i++; continue;
    }
    o += esc(line[i]); i++;
  }
  return o;
}

let isDocsOpen = false;

function updateToggleDocsBtn(){
  const btn = document.getElementById('toggle-docs-btn');
  const container = document.getElementById('docs-content');
  if(!btn || !container) return;

  if(isDocsOpen){
    container.classList.add('is-open');
    btn.classList.add('is-open');
  } else {
    container.classList.remove('is-open');
    btn.classList.remove('is-open');
  }
}

function initApp(){
  var codeArea = document.getElementById('code-area');
  if(codeArea){
    codeArea.innerHTML = CODE.split('\n').map(tokLine).join('\n');
  }

  var copyBtn = document.getElementById('copy-btn');
  if(copyBtn){
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(CODE).then(toast);
    });
  }

  loadAvatar();
  loadStatus();
  setInterval(loadStatus, 3000);

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(I18N.en[key]) el.innerHTML = I18N.en[key];
  });
  renderKeybinds();

  var toggleDocsBtn = document.getElementById('toggle-docs-btn');
  if(toggleDocsBtn){
    toggleDocsBtn.addEventListener('click', () => {
      isDocsOpen = !isDocsOpen;
      updateToggleDocsBtn();
      if(isDocsOpen){
        setTimeout(() => {
          const el = document.getElementById('docs-content');
          if(el){
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 50);
      }
    });
  }

  if(window.location.hash && window.location.hash.length > 1){
    isDocsOpen = true;
    updateToggleDocsBtn();
  }

  var liveClockEl = document.getElementById('live-clock');
  if(liveClockEl){
    function updateClock(){
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      const s = String(now.getSeconds()).padStart(2,'0');
      const ms = String(now.getMilliseconds()).padStart(3,'0');
      liveClockEl.textContent = h + ':' + m + ':' + s + ':' + ms;
    }
    setInterval(updateClock, 47);
    updateClock();
  }

  var filterBtns = document.querySelectorAll('.pill-btn');
  var searchableSections = document.querySelectorAll('.searchable-item');

  function applyFilter(){
    const activeBtn = document.querySelector('.pill-btn.active');
    const filterCat = activeBtn ? activeBtn.dataset.filter : 'all';

    searchableSections.forEach(section => {
      const cat = section.dataset.category;
      const matchesCat = (filterCat === 'all' || cat === filterCat);
      section.style.display = matchesCat ? 'flex' : 'none';
    });
  }

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter();
    });
  });
}
