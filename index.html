<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title> NAH NAH NAH NAH NAH NAH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
:root{
  --bg:#000;--w:#fff;
  --d60:rgba(255,255,255,.60);--d35:rgba(255,255,255,.35);
  --d07:rgba(255,255,255,.07);--d04:rgba(255,255,255,.04);
  --b:rgba(255,255,255,.09);--bh:rgba(255,255,255,.22);
  --mono:'JetBrains Mono','Consolas',monospace;
  --ui:'Inter',system-ui,sans-serif;
  --ck:#c792ea;--cs:#c3e88d;--cu:#89ddff;
  --cf:#82aaff;--cn:#f78c6c;--cp:#546e7a;--cc:#4a4a6a;
}
html,body{
  min-height:100vh;background:var(--bg);color:var(--w);
  font-family:var(--ui);display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow-x:hidden;padding:48px 20px 64px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.038'/%3E%3C/svg%3E");
  background-size:160px;opacity:.5;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 18% 6%,rgba(255,255,255,.022) 0%,transparent 70%),
    radial-gradient(ellipse 50% 40% at 82% 94%,rgba(255,255,255,.014) 0%,transparent 70%);
}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}

#page{
  position:relative;z-index:1;width:100%;max-width:640px;
  display:flex;flex-direction:column;align-items:center;gap:22px;
}

#title{text-align:center;animation:up .65s cubic-bezier(.22,1,.36,1) both}
#title h1{font-size:clamp(17px,3.8vw,28px);font-weight:300;letter-spacing:.22em;text-transform:uppercase}
#title hr{border:none;border-top:1px solid rgba(255,255,255,.14);width:36px;margin:10px auto 0}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

#ed{
  width:100%;border:1px solid var(--b);border-radius:11px;
  background:var(--d04);overflow:hidden;
  animation:up .65s .12s cubic-bezier(.22,1,.36,1) both;
  transition:border-color .3s;
}
#ed:hover{border-color:var(--bh)}
#ed-top{
  height:36px;display:flex;align-items:center;
  padding:0 12px;border-bottom:1px solid var(--b);justify-content:flex-end;
}
#copy-btn{
  position:relative;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:6px;border:1px solid var(--b);
  background:transparent;transition:border-color .2s,background .2s,transform .12s;user-select:none;
}
#copy-btn:hover{border-color:var(--bh);background:var(--d07)}
#copy-btn:active{transform:scale(.88)}
#copy-btn svg{width:13px;height:13px;stroke:var(--d35);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s;pointer-events:none}
#copy-btn:hover svg{stroke:var(--d60)}
#copy-toast{
  position:absolute;top:calc(100%+7px);right:0;
  background:#000;color:var(--w);border:1px solid var(--b);font-size:10px;font-family:var(--mono);
  padding:3px 9px;border-radius:5px;white-space:nowrap;
  opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;
  pointer-events:none;letter-spacing:.02em;z-index:10;
}
#copy-toast.show{opacity:1;transform:translateY(0)}
#code-area{
  padding:16px 18px;font-family:var(--mono);font-size:13px;line-height:23px;
  white-space:pre-wrap;word-break:break-all;overflow:hidden;
}
.sc{color:var(--cc);font-style:italic}
.sk{color:var(--ck);font-weight:500}
.ss{color:var(--cs)}
.su{color:var(--cu);text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(137,221,255,.3)}
.sf{color:var(--cf)}
.sn{color:var(--cn)}
.sp{color:var(--cp)}

#info{
  width:100%;padding:14px 18px;
  border:1px solid var(--b);border-radius:10px;background:var(--d04);
  animation:up .65s .22s cubic-bezier(.22,1,.36,1) both;
  font-size:12px;line-height:1.75;color:var(--d35);
}
#info strong{color:rgba(255,255,255,.7);font-weight:500}

#dc{
  width:100%;border:1px solid var(--b);border-radius:10px;
  background:var(--d04);overflow:hidden;
  animation:up .65s .32s cubic-bezier(.22,1,.36,1) both;
  transition:border-color .3s;
  display:flex;align-items:center;gap:0;
  padding:0;height:44px;
}
#dc:hover{border-color:var(--bh)}

#dc-av{
  width:44px;height:44px;flex-shrink:0;
  border-right:1px solid var(--b);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:#111;
}
#dc-av img{width:100%;height:100%;object-fit:cover;display:block;}

#dc-label{
  font-size:11px;font-family:var(--mono);color:var(--d60);
  letter-spacing:.06em;padding:0 14px;white-space:nowrap;
  border-right:1px solid var(--b);height:100%;display:flex;align-items:center;
}
#dc-label span{color:rgba(255,255,255,.2);margin:0 8px;}

#dc-spacer{flex:1;}

#show-profile-btn{
  height:100%;padding:0 16px;
  border:none;border-left:1px solid var(--b);background:transparent;
  font-size:10px;font-family:var(--mono);color:var(--d35);
  cursor:pointer;transition:color .2s,background .2s,transform .1s;letter-spacing:.05em;
  text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
#show-profile-btn:hover{color:var(--w);background:var(--d07)}
#show-profile-btn:active{transform:scale(.96)}
#show-profile-btn svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.6;}
</style>
</head>
<body>
<div id="page">

  <div id="title">
    <h1>The Strongest Battlegrounds . . . </h1>
    <hr>
  </div>

  <div id="ed">
    <div id="ed-top">
      <div id="copy-btn" title="">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <div id="copy-toast">Copied</div>
      </div>
    </div>
    <div id="code-area"></div>
  </div>

  <div id="info">
    <strong>Left-Alt</strong> — Toggle UI &nbsp;·&nbsp;
    IDK just check if it works / what it has —
    if not Good ..., just leave after test and <strong>Enjoy</strong>
  </div>

  <div id="dc">
    <div id="dc-av">
      <img id="dc-av-img" alt="avatar">
    </div>
    <div id="dc-label">
      NOTHING X <span>|</span> nothingff
    </div>
    <div id="dc-spacer"></div>
    <a id="show-profile-btn" href="https://discord.com/users/1161363602146607154" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Show Profile
    </a>
  </div>

</div>
<script>

document.addEventListener('contextmenu', e => e.preventDefault());

const ALLOWED = ['copy-btn','show-profile-btn'];
function isAllowed(el){
  while(el){
    if(el.id && ALLOWED.includes(el.id)) return true;
    el = el.parentElement;
  }
  return false;
}
['mousedown','mouseup','click','dblclick','dragstart','selectstart'].forEach(ev => {
  document.addEventListener(ev, e => {
    if(!isAllowed(e.target)) e.preventDefault();
  }, true);
});

let holdTimer;
document.addEventListener('touchstart', e => {
  if(!isAllowed(e.target)) holdTimer = setTimeout(() => e.preventDefault(), 300);
}, {passive:false});
document.addEventListener('touchend', () => clearTimeout(holdTimer));
document.addEventListener('touchmove', () => clearTimeout(holdTimer));

document.documentElement.style.userSelect = 'none';
document.documentElement.style.webkitUserSelect = 'none';

const CODE = `\n\n -- NOTHING X \n\n loadstring(game:HttpGet("https://raw.githubusercontent.com/nothingff0/0/0/0"))();\n\n-- NOTHING_X \n\n`;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const KW=new Set(['and','break','do','else','elseif','end','false','for','function','if','in','local','nil','not','or','repeat','return','then','true','until','while']);
const BT=new Set(['print','warn','error','require','pairs','ipairs','type','tostring','tonumber','pcall','wait','spawn','game','workspace','loadstring','HttpGet']);

function tokLine(line){
  let o='',i=0,n=line.length;
  while(i<n){
    if(line[i]==='-'&&line[i+1]==='-'){o+=`<span class="sc">${esc(line.slice(i))}</span>`;i=n;continue;}
    if(line[i]==='"'||line[i]==="'"){
      const q=line[i];let j=i+1;
      while(j<n&&line[j]!==q){if(line[j]==='\\')j++;j++;}
      const str=line.slice(i,j+1);
      o+=str.includes('http')?`<span class="su">${esc(str)}</span>`:`<span class="ss">${esc(str)}</span>`;
      i=j+1;continue;
    }
    if(/[0-9]/.test(line[i])){
      let j=i;while(j<n&&/[0-9._xXa-fA-F]/.test(line[j]))j++;
      o+=`<span class="sn">${esc(line.slice(i,j))}</span>`;i=j;continue;
    }
    if(/[A-Za-z_]/.test(line[i])){
      let j=i;while(j<n&&/[A-Za-z0-9_]/.test(line[j]))j++;
      const w=line.slice(i,j);
      if(KW.has(w)) o+=`<span class="sk">${esc(w)}</span>`;
      else if(BT.has(w)) o+=`<span class="sf">${esc(w)}</span>`;
      else o+=esc(w);
      i=j;continue;
    }
    if(/[{}()\[\].,;:+\-*\/%^#<>=~]/.test(line[i])){o+=`<span class="sp">${esc(line[i])}</span>`;i++;continue;}
    o+=esc(line[i]);i++;
  }
  return o;
}
document.getElementById('code-area').innerHTML=CODE.split('\n').map(tokLine).join('\n');

const USER_ID = '1161363602146607154';
const CDN = 'https://cdn.discordapp.com';

function defaultAvatar(id){
  const idx = (BigInt(id) >> 22n) % 6n;
  return `${CDN}/embed/avatars/${idx}.png`;
}

async function loadAvatar(){
  const img = document.getElementById('dc-av-img');
  img.src = defaultAvatar(USER_ID);
  try {
    const res = await fetch(`https://discordlookup.mesavirep.xyz/v1/user/${USER_ID}`);
    if(!res.ok) throw 0;
    const d = await res.json();
    if(d.avatar){
      const ext = d.avatar.startsWith('a_') ? 'gif' : 'webp';
      img.src = `${CDN}/avatars/${USER_ID}/${d.avatar}.${ext}?size=128`;
    }
  } catch(e){}
}
loadAvatar();

function toast(){
  const t=document.getElementById('copy-toast');
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);
}
document.getElementById('copy-btn').addEventListener('click',()=>{
  navigator.clipboard.writeText(CODE).then(toast);
});

</script>
</body>
</html>
